table:
  name: workflow_triggers
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
insert_permissions:
  - role: user
    permission:
      check:
        workflow:
          organization:
            org_members:
              role:
                _in:
                  - owner
                  - editor
              user_id:
                _eq: X-Hasura-User-Id
      columns:
        - enabled
        - config
        - type
        - created_at
        - id
        - workflow_id
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - enabled
        - config
        - type
        - created_at
        - id
        - workflow_id
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - enabled
        - config
        - type
        - created_at
        - id
        - workflow_id
      filter:
        workflow:
          organization:
            org_members:
              role:
                _in:
                  - owner
                  - editor
              user_id:
                _eq: X-Hasura-User-Id
      check: null
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter:
        workflow:
          organization:
            org_members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
    comment: ""
