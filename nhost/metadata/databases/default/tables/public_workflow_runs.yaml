table:
  name: workflow_runs
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: organization_id
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_run_id
        table:
          name: step_runs
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        organization:
          org_members:
            role:
              _in:
                - owner
                - editor
            user_id:
              _eq: X-Hasura-User-Id
      columns:
        - error
        - status
        - completed_at
        - created_at
        - started_at
        - id
        - organization_id
        - workflow_id
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - error
        - status
        - completed_at
        - created_at
        - started_at
        - id
        - organization_id
        - workflow_id
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - error
        - status
        - completed_at
        - created_at
        - started_at
        - id
        - organization_id
        - workflow_id
      filter:
        organization:
          org_members:
            role:
              _in:
                - owner
                - editor
            user_id:
              _eq: X-Hasura-User-Id
      check: null
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter:
        organization:
          org_members:
            role:
              _eq: owner
            user_id:
              _eq: X-Hasura-User-Id
    comment: ""
