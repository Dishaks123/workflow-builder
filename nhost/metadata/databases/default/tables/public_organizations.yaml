table:
  name: organizations
  schema: public
array_relationships:
  - name: org_members
    using:
      foreign_key_constraint_on:
        column: organization_id
        table:
          name: org_members
          schema: public
  - name: workflow_runs
    using:
      foreign_key_constraint_on:
        column: organization_id
        table:
          name: workflow_runs
          schema: public
  - name: workflows
    using:
      foreign_key_constraint_on:
        column: organization_id
        table:
          name: workflows
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - calls_allowed
        - calls_used
        - name
        - created_at
        - quota_period_start
        - id
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - calls_allowed
        - calls_used
        - name
        - created_at
        - quota_period_start
        - id
      filter:
        org_members:
          role:
            _eq: owner
          user_id:
            _eq: X-Hasura-User-Id
      check: null
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter:
        org_members:
          role:
            _eq: owner
          user_id:
            _eq: X-Hasura-User-Id
    comment: ""
